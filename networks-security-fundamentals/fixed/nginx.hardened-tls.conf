# SIKILAŞTIRILMIŞ: HTTP'den HTTPS'e zorunlu yönlendirme ve modern TLS parametreleri
server {
    listen 80;
    server_name api.kargaa.com;
    # 80 portuna gelen her şeyi kalıcı olarak 443'e yönlendir
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.kargaa.com;

    ssl_certificate /etc/ssl/certs/kargaa.crt;
    ssl_certificate_key /etc/ssl/private/kargaa.key;

    # Güvenli TLS profili (Sadece TLS 1.2 ve 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS: Tarayıcıyı 1 yıl boyunca yalnızca HTTPS kullanmaya zorla
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
